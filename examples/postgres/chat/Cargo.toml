[package]
name = "sqlx-example-postgres-chat"
version = "0.0.0-dev"
publish = false
edition = "2021"
workspace = "../../../"

[dependencies]
sqlx = { path = "../../../", registry = "prismarisk", features = [ "postgres", "runtime-tokio", "tls-native-tls" ] }
tokio = { version = "1.25.0", features = [ "rt-multi-thread", "macros" ] }
ratatui = "0.30.0"
crossterm = "0.29.0"
unicode-width = "0.2.2"
