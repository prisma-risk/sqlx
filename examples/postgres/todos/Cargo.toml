[package]
name = "sqlx-example-postgres-todos"
version = "0.0.0-dev"
publish = false
edition = "2018"
workspace = "../../../"

[dependencies]
anyhow = "1.0.58"
sqlx = { path = "../../../", registry = "prismarisk", features = [ "postgres", "runtime-tokio", "tls-native-tls" ] }
clap = { version = "4.4.7", features = ["derive"] }
tokio = { version = "1.25.0", features = ["rt", "macros"]}
dotenvy = "0.15.7"
